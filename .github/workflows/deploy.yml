name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch makes the older deploy pointless.
concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Upload only the site files — never .git, the README, or repo config.
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html weather-domain.js manifest.json sw.js icon-*.png og.jpg _headers dist/

      # Cloudflare Pages treats the production branch as production and every
      # other branch name as a preview, so one command covers both cases.
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamkacha --branch=${{ github.head_ref || github.ref_name }}

      # One comment per PR, edited in place — a new comment on every push
      # would bury the conversation.
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\n🌐 **Preview:** ${process.env.URL}\n\nDeployed from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. Updates on every push to this branch.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
