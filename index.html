<style>
  :root{
    --bg:#0f1115; --fg:#f2f4f8; --muted:#8b93a3; --line:rgba(255,255,255,.09);
    --card:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    line-height:1.5; display:flex; flex-direction:column; align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
    transition:background 1.1s ease; overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:var(--glow,radial-gradient(120% 80% at 50% 0%,rgba(120,130,150,.18),transparent 70%));
    transition:background 1.1s ease;
  }
  .wrap{width:100%; max-width:560px; margin:auto 0; display:flex; flex-direction:column; gap:20px}

  .place{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:15px}
  .place b{color:var(--fg); font-weight:500}
  .pill{
    background:none; font:inherit; font-size:13.5px; color:var(--muted);
    cursor:pointer; padding:4px 11px; border-radius:999px; border:1px solid var(--line); transition:.18s;
  }
  .pill:hover{color:var(--fg); border-color:rgba(255,255,255,.28)}
  .pill.primary{
    font-size:14.5px; font-weight:500; padding:10px 20px;
    color:var(--fg); background:var(--chipBg,rgba(255,255,255,.08));
    border-color:transparent; transition:.2s;
  }
  .pill.primary:hover{filter:brightness(1.25); transform:translateY(-1px)}

  .verdict{text-align:center; display:flex; flex-direction:column; gap:11px; align-items:center}
  .verdict .emoji{font-size:clamp(42px,12vw,60px); line-height:1}
  .verdict h1{margin:0; font-weight:900; letter-spacing:-.02em; font-size:clamp(29px,7.8vw,44px); line-height:1.13; text-wrap:balance}
  .verdict .sub{margin:0; color:var(--muted); font-size:clamp(15px,4vw,17px); font-weight:300; text-wrap:balance; max-width:34ch}

  .cards{display:grid; grid-template-columns:1fr auto 1fr; gap:10px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px 12px 14px; text-align:center; backdrop-filter:blur(12px);
    display:flex; flex-direction:column; gap:1px; justify-content:center;
  }
  .card .label{color:var(--muted); font-size:13px; font-weight:500}
  .card .temp{direction:ltr; font-size:clamp(33px,9.5vw,42px); font-weight:700; letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums}
  .card .temp span{font-size:.5em; font-weight:400; color:var(--muted)}
  .vs{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-width:72px}
  .chip{
    direction:ltr; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    border-radius:999px; white-space:nowrap; transition:.6s;
    background:var(--chipBg,rgba(255,255,255,.08)); color:var(--chipFg,var(--fg));
  }
  .vs .chip{font-size:20px; padding:7px 11px}
  .vs .cap{color:var(--muted); font-size:11.5px; letter-spacing:.05em; font-weight:500}

  /* ---- "feels like" row ---- */

    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;

  .feels .ttl{color:var(--muted); font-size:13.5px; font-weight:500; white-space:nowrap}
  .feels .vals{display:flex; align-items:center; gap:10px; direction:ltr}
  .feels .v{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .feels .v.old{color:var(--muted); font-weight:400}
  .feels .arw{color:var(--muted); font-size:13px}
  .feels .chip{font-size:14px; padding:4px 9px}
  .gap{
    margin-top:-8px; padding:12px 16px; border-radius:14px;
    background:var(--gapBg,rgba(255,255,255,.05)); border:1px solid var(--line);

  .foot{text-align:center; color:var(--muted); font-size:12.5px; font-weight:300; line-height:1.8}

  .foot .row{display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:9px}

  .msg{text-align:center; padding:40px 0; color:var(--muted); font-size:16px; font-weight:300}
  .spin{width:26px; height:26px; margin:0 auto 14px; border-radius:50%; border:2px solid rgba(255,255,255,.14); border-top-color:var(--fg); animation:sp .8s linear infinite}

  .sheet{position:fixed; inset:0; z-index:20; background:rgba(8,9,12,.82); backdrop-filter:blur(14px); display:none; padding:20px; flex-direction:column; align-items:center}
  .sheet.on{display:flex}
  .sheet .box{width:100%; max-width:440px; margin-top:7vh; display:flex; flex-direction:column; gap:11px}
  .sheet h2{margin:0; font-size:20px; font-weight:700}
  .sheet input{width:100%; padding:15px 17px; font:inherit; font-size:16px; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:14px; color:var(--fg); outline:none; transition:.18s}
  .sheet input:focus{border-color:rgba(255,255,255,.34); background:rgba(255,255,255,.09)}

  .results{display:flex; flex-direction:column; gap:6px; max-height:40vh; overflow:auto}
  .results button,.geobtn{width:100%; text-align:start; padding:13px 15px; font:inherit; font-size:15px; background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:13px; color:var(--fg); cursor:pointer; transition:.15s}
  .results button:hover,.geobtn:hover{background:rgba(255,255,255,.1)}

  .geobtn{text-align:center}
  .recent{display:flex; flex-wrap:wrap; gap:6px}
  .recent button{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font:inherit; font-size:13.5px; color:var(--fg); cursor:pointer; transition:.15s}
  .recent button:hover{background:rgba(255,255,255,.11)}
  .lbl{color:var(--muted); font-size:12.5px; font-weight:500; padding-inline-start:3px}
  .close{background:none; border:0; color:var(--muted); font:inherit; font-size:15px; cursor:pointer; padding:10px; margin-top:2px}
  .hint{color:var(--muted); font-size:13px; font-weight:300; text-align:center}
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#22262e; border:1px solid var(--line); color:var(--fg);
    padding:13px 20px; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:.28s; z-index:40;
    max-width:min(420px, calc(100vw - 36px)); text-align:center;
    display:flex; flex-direction:column; gap:3px;
  }
  .toast b{font-size:14.5px; font-weight:600}
  .toast span{font-size:13px; font-weight:300; color:var(--muted); line-height:1.45}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
</style>

<div class="wrap" id="app"><div class="msg"><div class="spin"></div>רגע, בודק…</div></div>

  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============================================================
   1. Verdict scale, keyed to the actual temperature delta
   ============================================================ */
const SCALE = [
  { min: 8,         emoji:'🔥🔥', glow:'#ff4d2e', texts:[
      'אוקיי, זה כבר לא מזג אוויר. זו עמדה.',
      'בשנה שעברה בתאריך הזה חיינו חיים אחרים',
      'מישהו הזיז את כדור הארץ קצת קדימה' ]},
  { min: 5,         emoji:'🔥',   glow:'#ff7a1a', texts:[
      'חם. לא "חם ישראלי". חם חם.',
      'שנה שעברה אפשר היה לצאת. היום פחות.',
      'השנה החליטה להראות לנו מי כאן הבוס' ]},
  { min: 3,         emoji:'😮‍💨', glow:'#ffa53d', texts:[
      'יותר חם, ובאופן שמרגישים',
      'לא אסון, אבל שמנו לב',
      'השנה מתאמצת. לא ביקשנו.' ]},
  { min: 1.5,       emoji:'🙂',   glow:'#ffce6b', texts:[
      'טיפה יותר חם. כאילו, טיפה.',
      'בקושי. אבל כן.',
      'ההבדל בגודל של אנחה אחת' ]},
  { min: -1.5,      emoji:'😐',   glow:'#8b93a3', texts:[
      'בערך אותו שיט',
      'אותו דבר. ליטרלית.',
      'שנה עברה, כלום לא זז',
      'היקום החליט לא להתערב הפעם' ]},
  { min: -3,        emoji:'🙃',   glow:'#8fd0c4', texts:[
      'טיפה יותר נעים. ניקח.',
      'קצת יותר קריר, וזה נחמד',
      'טובה קטנה, בלי דרמות' ]},
  { min: -5,        emoji:'😌',   glow:'#5bc0d8', texts:[
      'יותר נעים משנה שעברה. תיהנו.',
      'מתנה קטנה מהאטמוספירה',
      'אפשר לצאת בלי לתכנן מסלול צל' ]},
  { min: -8,        emoji:'🧊',   glow:'#4b9df0', texts:[
      'קר יותר. ממש יותר.',
      'שנה שעברה זה היה קיץ. היום פחות.',
      'תביא סוודר. ברצינות.' ]},
  { min: -Infinity, emoji:'🧊🧊', glow:'#4668f0', texts:[
      'מה קרה פה? זו עונה אחרת לגמרי',
      'זה לא אותו תאריך, זה לא אותו כוכב',
      'הביאו לנו בטעות את מזג האוויר של מישהו אחר' ]},
];

function context(now){
  const deg = n => `<span dir="ltr">${Math.round(n)}°</span>`;
  if (now >= 38) return 'ובכל מקרה ' + deg(now) + ', אז זה כבר עניין של הישרדות';
  if (now >= 30) return 'אבל בוא נודה, זה קיץ. מה ציפית.';
  if (now >= 20) return 'בסך הכל מזג אוויר של בן אדם';
  if (now >= 10) return 'ובגדול, מזג אוויר סביר לחלוטין';
  return 'וממילא ' + deg(now) + ', אז ההבדל הוא בין קר לקר';
}

/* ============================================================
   2. The "feels like" gap — when the temperature and the body disagree
   ------------------------------------------------------------
   gap = (felt delta) minus (actual delta).
   Positive = the body suffers more than the number admits. Negative = the reverse.

   apparent_temperature folds humidity, wind and solar radiation into
   a single number, so it alone cannot tell you which of the three is
   to blame. We used to blame humidity every time — that was a guess
   delivered with unearned confidence. Now we fetch relative_humidity_2m
   for both dates (one extra field on the same two requests, no third
   request) and name humidity only when it actually moved in the
   direction that explains the gap. Otherwise we describe the sensation
   without inventing a cause for it.
   ============================================================ */
const RH_SURE = 8;    /* Under 8 percentage points is noise, not a trend */
const RH_WARM = 20;   /* Below 20° humidity barely enters perceived heat, so we do not blame it */

function feelsGap(d, dReal, dFeel){
  const gap = dFeel - dReal;
  if (Math.abs(gap) < 2) return null;

  /* Up to 1.4° the delta is still visible on screen, so "exactly" would contradict the number beside it */
  const same = Math.abs(dReal) < 1.5;
  const dRH  = (d.nowRH == null || d.thenRH == null) ? null : d.nowRH - d.thenRH;
  const rh   = n => `<span dir="ltr">${Math.round(n)}%</span>`;
  const from = () => `מ-${rh(d.thenRH)} ל-${rh(d.nowRH)}`;
  const know = dRH != null && d.now >= RH_WARM;   /* Are we allowed to name humidity? */

  if (gap >= 2) {
    return { tone:'#ff8a3d', texts: know && dRH >= RH_SURE ? (same ? [
        `<b>אותה טמפרטורה, פחות או יותר</b> — אבל הלחות עלתה ${from()}. הגוף לא מתווכח עם המספר, הוא מתווכח עם האוויר.`,
        `<b>המספר זהה, ההרגשה לא.</b> הלחות טיפסה ${from()}, וזה חלק גדול מההבדל.`,
      ] : [
        `ולא רק זה — <b>הלחות עלתה ${from()}</b>, אז זה מרגיש אפילו יותר גרוע ממה שכתוב.`,
        `הטמפרטורה היא חצי מהסיפור: <b>האוויר לח יותר משנה שעברה</b> (${from()}), והחצי השני נדבק לחולצה.`,
      ]) : (same ? [
        '<b>אותה טמפרטורה, פחות או יותר</b> — ובכל זאת האוויר מרגיש כבד יותר. רוח, שמש או לחות; משהו שם עובד נגדך.',
        '<b>המספר זהה, התחושה גרועה יותר.</b> לא הכל נכנס למד החום.',
      ] : [
        'ולא רק זה — <b>זה גם מרגיש גרוע יותר ממה שהמספר מודה</b>. הרוח, השמש והלחות עושות את שלהן.',
        'והגוף מקצין את זה עוד: <b>ההרגשה בפועל גרועה מהמספר היבש</b>.',
      ])};
  }

  return { tone:'#5bc0d8', texts: know && dRH <= -RH_SURE ? (same ? [
      `<b>אותה טמפרטורה, פחות או יותר</b>, אבל הלחות ירדה ${from()} — אז זה מרגיש קליל בהרבה.`,
      `המספר זהה, <b>הגוף ירגיש טוב יותר</b>: פחות לחות באוויר (${from()}).`,
    ] : [
      `ו<b>יבש יותר משנה שעברה</b> — הלחות ירדה ${from()}, אז בפועל זה נסבל הרבה יותר ממה שהטמפרטורה מרמזת.`,
      `הטמפרטורה מגזימה: <b>הלחות ירדה ${from()}</b>, וזה משנה את כל התחושה.`,
    ]) : (same ? [
      '<b>אותה טמפרטורה, פחות או יותר</b> — ובכל זאת האוויר מרגיש נוח יותר. משהו שם עובד לטובתך.',
      '<b>המספר זהה, ההרגשה טובה יותר.</b> תיהנה, אל תשאל.',
    ] : [
      'אבל <b>זה מרגיש נעים יותר ממה שהמספר מבטיח</b> — הרוח והשמש גם משתתפות בחישוב.',
      'והתחושה בפועל טובה מהמספר: <b>לא הכל נמדד במעלות</b>.',
    ])};
}

function pick(arr, seed){
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return arr[Math.abs(h) % arr.length];
}

const WMO = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};

/* ============================================================
   3. Helpers
   ============================================================ */
const $ = s => document.querySelector(s);

/* Every string from an external source — a city name from the API, a URL
   parameter, an error message — goes through here before it touches
   innerHTML. Without it, a shared link carrying name=<img onerror=...>
   runs foreign code on our own origin. */
/* Ad blockers frequently block the Umami script. This wrapper keeps the
   app working when it fails to load. */
const track = (name, data) => { try { window.umami?.track(name, data); } catch(e){} };

const ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = v => String(v).replace(/[&<>"']/g, c => ESC[c]);
const app = $('#app'), sheet = $('#sheet');
const pad = n => String(n).padStart(2,'0');
const KEY = 'hamkacha.place', KEY_R = 'hamkacha.recent';

const ls = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};

let DATA = null;

const fmt1 = c => `${c.toFixed(1)}<span>°</span>`;
const fmt0 = c => `${Math.round(c)}°`;
const fmtD = d => `${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d).toFixed(1)}°`;

function lastYear(d){
  const y = d.getFullYear() - 1, m = d.getMonth(), day = d.getDate();
  const safe = (m === 1 && day === 29) ? 28 : day;   // Feb 29 does not exist every year
  return `${y}-${pad(m+1)}-${pad(safe)}`;
}
const heDate = d => d.toLocaleDateString('he-IL',{day:'numeric',month:'long'});

async function getJSON(url, signal){
  const r = await fetch(url, { signal });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ------------------------------------------------------------
   Request races: every request here is exactly as slow as the network
   decides, and any screen painted from a stale response is a lying
   screen. Two guards:
   gen — a counter of location picks, which orphans a GPS lookup the
         user has already overtaken with a manual choice; and an
         AbortController per request kind, which both cancels the
         request itself and marks which request is the current one.
   ------------------------------------------------------------ */
let gen = 0, loadAC = null, geoAC = null, searchAC = null;
const stop = ac => { if (ac) ac.abort(); return null; };
const quiet = e => e && e.name === 'AbortError';   /* A deliberate abort — not an error worth showing */

function toast(title, body){
  const t = $('#toast');
  t.innerHTML = `<b>${esc(title)}</b>` + (body ? `<span>${esc(body)}</span>` : '');
  t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3000);
}

/* ============================================================
   4. Fetching the data
   ============================================================ */
async function load(place){
  loadAC = stop(loadAC);                 /* An earlier load still in flight is no longer interesting */
  const ac = loadAC = new AbortController();
  app.innerHTML = '<div class="msg"><div class="spin"></div>רגע, בודק…</div>';
  const { lat, lon, name } = place;
  const q = `latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&timezone=auto`;

  try {
    const now = await getJSON(
      `https://api.open-meteo.com/v1/forecast?${q}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code`, ac.signal);

    const localNow = new Date(now.current.time);
    const hour = localNow.getHours();
    const date = lastYear(localNow);

    const past = await getJSON(
      `https://archive-api.open-meteo.com/v1/archive?${q}` +
      `&start_date=${date}&end_date=${date}` +
      `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m`, ac.signal);

    const i = past.hourly.time.findIndex(t => t.endsWith(`T${pad(hour)}:00`));
    if (i < 0 || past.hourly.temperature_2m[i] == null) throw new Error('אין נתונים לתאריך הזה');
    if (loadAC !== ac) return;           /* A different place was picked meanwhile — do not overwrite it */

    DATA = {
      lat, lon, name, hour, localNow,
      now:      now.current.temperature_2m,
      nowFeel:  now.current.apparent_temperature,
      nowRH:    now.current.relative_humidity_2m ?? null,
      code:     now.current.weather_code,
      then:     past.hourly.temperature_2m[i],
      thenFeel: past.hourly.apparent_temperature[i],
      thenRH:   past.hourly.relative_humidity_2m?.[i] ?? null,
      seed: `${lat.toFixed(2)},${lon.toFixed(2)},${localNow.toDateString()}`,
    };
    render();
  } catch (e) {
    if (quiet(e) || loadAC !== ac) return;
    app.innerHTML = `<div class="msg fade">משהו השתבש 🤷<br><small style="opacity:.7">${esc(e.message)}</small><br><br>
      <button class="geobtn" style="max-width:220px;margin:0 auto" onclick="location.reload()">נסה שוב</button></div>`;
  }
}

/* ============================================================
   5. Render
   ============================================================ */
function render(){
  const d = DATA;
  const dReal = d.now - d.then;
  const dFeel = d.nowFeel - d.thenFeel;
  const level = SCALE.find(s => dReal >= s.min);
  const gap   = feelsGap(d, dReal, dFeel);

  document.body.style.setProperty('--glow', `radial-gradient(125% 85% at 50% 0%, ${level.glow}30, transparent 68%)`);
  document.body.style.setProperty('--chipBg', level.glow + '26');
  document.body.style.setProperty('--chipFg', level.glow);
  if (gap){
    document.body.style.setProperty('--gapBg', gap.tone + '14');
    document.body.style.setProperty('--gapFg', gap.tone);
  }

  app.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:20px">
      <div class="place">
        <b>${esc(d.name)}</b><span>·</span>
        <span>${heDate(d.localNow)}, <span dir="ltr">${pad(d.hour)}:00</span></span>
        <button class="pill" id="chg">שנה מיקום</button>
      </div>

      <div class="verdict">
        <div class="emoji">${level.emoji}</div>
        <h1>${pick(level.texts, d.seed)}</h1>
        <p class="sub">${context(d.now)}</p>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">לפני שנה</div>
          <div class="temp">${fmt1(d.then)}</div>
        </div>
        <div class="vs">
          <div class="chip">${fmtD(dReal)}</div>
          <div class="cap">הפרש</div>
        </div>
        <div class="card">
          <div class="label">עכשיו ${WMO[d.code] || ''}</div>
          <div class="temp">${fmt1(d.now)}</div>
        </div>
      </div>

      <div class="feels">
        <span class="ttl">מרגיש כמו</span>
        <div class="vals">
          <span class="v old">${fmt0(d.thenFeel)}</span>
          <span class="arw">→</span>
          <span class="v">${fmt0(d.nowFeel)}</span>
          <span class="chip">${fmtD(dFeel)}</span>
        </div>
      </div>

      ${gap ? `<div class="gap">${pick(gap.texts, d.seed + 'g')}</div>` : ''}

      <div class="foot">
        <div class="row">
          <button class="pill primary" id="share">שלח את זה למישהו שמתלונן ←</button>
        </div>
        אותו מקום, אותו תאריך, אותה שעה — רק שנה אחת אחורה.<br>
        נתונים: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · ארכיון ECMWF
      </div>
    </div>`;

  $('#chg').onclick = openSheet;
  $('#share').onclick = share;
}

/* ============================================================
   6. Sharing — the link opens the exact same place
   ============================================================ */
function shareURL(){
  const d = DATA;
  /* 2 decimals is about 1.1 km. At 4 decimals (about 11 m) sharing from a
     GPS fix would hand out your home address. The archive grid cell is
     9 km or coarser anyway, so that was imaginary precision — the privacy
     we gave up bought us nothing. */
  return `${location.origin}${location.pathname}` +
    `?lat=${d.lat.toFixed(2)}&lon=${d.lon.toFixed(2)}&name=${encodeURIComponent(d.name)}`;
}

/* Bait, not a report. No numbers — the numbers are the reason to click,
   and if they are already in the message there is no reason to open it.
   Every variant anchors itself in weather, otherwise the message lands
   in WhatsApp with no context at all. All of them are deliberately
   neutral ("the weather" rather than "hotter"), because the answer can
   just as easily be "colder" or "the same". */
function shareTexts(){
  const c = DATA.name;
  return [
    `היה חם ככה שנה שעברה? הנה התשובה ל${c}.`,
    `מזג האוויר ב${c} היום, מול אותו יום בדיוק לפני שנה.`,
    `אני לא מדמיין את מזג האוויר הזה. תראה בעצמך.`,
    `טענת שמזג האוויר לא היה ככה שנה שעברה. בוא נבדוק.`,
    `אותו מקום, אותו תאריך, אותה שעה — לפני שנה. תשווה.`,
    `לא זיכרון של מזג אוויר. נתונים. ${c}, היום מול אשתקד.`,
    `הטמפרטורה ב${c}: היום מול לפני שנה. תלחץ.`,
    `שנינו אמרנו "כן אחי, מזג אוויר מטורף". בוא נראה אם צדקנו.`,
  ];
}

/* A different variant on every click, and never the same one twice in a row */
let lastShare = -1;
function rollText(){
  const list = shareTexts();
  let i;
  do { i = Math.floor(Math.random() * list.length); }
  while (list.length > 1 && i === lastShare);
  lastShare = i;
  return { text: list[i], i };
}

/* Fallback for older browsers where navigator.clipboard is unavailable */
function legacyCopy(str){
  const ta = document.createElement('textarea');
  ta.value = str;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

/* Copies straight to the clipboard. Deliberately not navigator.share — on
   desktop it opens the OS share sheet, which is friction where one action
   would do. */
function share(){
  const { text, i } = rollText(), payload = `${text}\n${shareURL()}`;
  track('share_click', { variant: i });
  /* variant lets us see which wording actually makes people share */
  const done = () => { track('share_copied', { variant: i }); toast('הועתק ✓', text); };
  const fail = () => { track('share_failed', { variant: i }); toast('לא הצלחתי להעתיק', 'נסה שוב'); };

  if (navigator.clipboard && isSecureContext) {
    navigator.clipboard.writeText(payload).then(done, () => legacyCopy(payload) ? done() : fail());
  } else {
    legacyCopy(payload) ? done() : fail();
  }
}

/* ============================================================
   7. Location picking
   ============================================================ */
function remember(p){
  ls.set(KEY, p);
  const list = ls.get(KEY_R, []).filter(x => x.name !== p.name);
  list.unshift(p);
  ls.set(KEY_R, list.slice(0, 5));
}

function drawRecent(){
  const list = ls.get(KEY_R, []);
  $('#recentLbl').hidden = list.length === 0;
  $('#recent').innerHTML = list.map((p, i) =>
    `<button data-i="${i}">${esc(p.name)}</button>`).join('');
  $('#recent').querySelectorAll('button').forEach(b => b.onclick = () => {
    choose(ls.get(KEY_R, [])[+b.dataset.i]);
  });
}

/* The single gate for picking a location. It advances gen, so any GPS
   lookup still in flight loses its right to paint the screen here. */
function choose(p){
  gen++;
  geoAC = stop(geoAC);
  remember(p); closeSheet(); load(p);
}

/* The dialog is modal: focus moves inside, cannot escape via Tab, and
   returns at the end to the button that opened it. Without this a
   keyboard user "leaves" the sheet without closing it and keeps
   wandering the page behind it. */
const FOCUSABLE = 'button, input, [href], [tabindex]:not([tabindex="-1"])';
let lastFocus = null;

function openSheet(){
  lastFocus = document.activeElement;
  drawRecent();
  sheet.classList.add('on');
  app.inert = true;               /* Take the background out of the keyboard and screen-reader path */
  $('#q').focus();
}
function closeSheet(){
  sheet.classList.remove('on');
  app.inert = false;
  clearTimeout(timer);
  searchAC = stop(searchAC);
  $('#res').innerHTML=''; $('#q').value=''; $('#hint').textContent='';
  /* render() replaces the contents of #app, so the button that opened us may no longer be in the document */
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}
$('#closeSheet').onclick = closeSheet;
sheet.onclick = e => { if (e.target === sheet) closeSheet(); };

addEventListener('keydown', e => {
  if (!sheet.classList.contains('on')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const f = [...sheet.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

let timer;
$('#q').oninput = e => {
  clearTimeout(timer);
  searchAC = stop(searchAC);      /* Not just the timer — also a request that already left */
  const v = e.target.value.trim();
  if (v.length < 2) { $('#res').innerHTML=''; return; }
  timer = setTimeout(async () => {
    const ac = searchAC = new AbortController();
    try {
      const r = await getJSON(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=he`, ac.signal);
      if (searchAC !== ac) return;
      $('#res').innerHTML = (r.results || []).map(x =>
        `<button data-lat="${+x.latitude}" data-lon="${+x.longitude}" data-name="${esc(x.name)}">
           ${esc(x.name)} <small>${esc([x.admin1, x.country].filter(Boolean).join(', '))}</small></button>`).join('')
        || '<div class="hint">לא נמצא. נסה איות אחר.</div>';
      $('#res').querySelectorAll('button').forEach(b => b.onclick = () => {
        choose({ lat:+b.dataset.lat, lon:+b.dataset.lon, name:b.dataset.name });
      });
    } catch(e){
      if (quiet(e) || searchAC !== ac) return;
      $('#res').innerHTML = '<div class="hint">החיפוש לא זמין כרגע.</div>';
    }
  }, 260);
};

$('#useGeo').onclick = () => locate(true);

function locate(explicit){
  if (!navigator.geolocation) { openSheet(); return; }
  $('#hint').textContent = 'מבקש מיקום…';
  /* The location prompt can take many seconds. If the user lost patience
     meanwhile and picked a city by hand, gen has already advanced and
     this answer is dead. */
  const my = ++gen;
  navigator.geolocation.getCurrentPosition(async pos => {
    if (my !== gen) return;
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = 'המיקום שלך';
    const ac = geoAC = new AbortController();
    try {
      const g = await getJSON(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=he`, ac.signal);
      name = g.city || g.locality || g.principalSubdivision || name;
    } catch(e){ if (quiet(e)) return; }
    if (my !== gen) return;
    choose({ lat, lon, name });
  }, () => {
    if (my !== gen) return;
    $('#hint').textContent = 'אין גישה למיקום — חפש עיר ידנית.';
    if (!explicit) openSheet();
  }, { timeout: 9000, maximumAge: 600000 });
}

/* ============================================================
   8. Bootstrap — a shared link wins over everything
   ============================================================ */
/* Parameters from a shared link are potential attacker input — we validate
   the range, cap the length, and leave HTML escaping to esc() at render
   time. */
function fromURL(){
  const u = new URLSearchParams(location.search);
  if (!u.has('lat') || !u.has('lon')) return null;
  const lat = +u.get('lat'), lon = +u.get('lon');
  if (!isFinite(lat) || !isFinite(lon)) return null;
  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
  return { lat, lon, name: (u.get('name') || 'המקום הזה').slice(0, 60) };
}

const shared = fromURL();

if (shared) {
  remember(shared);
  history.replaceState(null, '', location.pathname);   // clean up the address bar
  load(shared);
} else {
  const s = ls.get(KEY, null);
  if (s) load(s);
  else if (navigator.geolocation) { app.innerHTML = '<div class="msg"><div class="spin"></div>מאתר אותך…</div>'; locate(false); }
  else openSheet();
}

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

})();
</script>
</body>
</html>
