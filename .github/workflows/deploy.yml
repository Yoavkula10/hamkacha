name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch makes the older deploy pointless.
concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub does not expose repository secrets to fork PRs. Skip their
    # preview deploy instead of running the publisher with empty credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.publish.outputs.deployment-url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Upload only the site files — never .git, the README, or repo config.
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html weather-domain.js manifest.json sw.js icon-*.png og.jpg _headers dist/

      # Cloudflare Pages treats the production branch as production and every
      # other branch name as a preview, so one command covers both cases.
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hamkacha --branch=${{ github.head_ref || github.ref_name }}

  comment-preview:
    if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # One comment per PR, edited in place — a new comment on every push
      # would bury the conversation.
      - name: Comment the preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          URL: ${{ needs.deploy.outputs.preview-url }}
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\n🌐 **Preview:** ${process.env.URL}\n\nDeployed from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. Updates on every push to this branch.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
