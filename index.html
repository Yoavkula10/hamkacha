<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חם ככה — היה חם ככה שנה שעברה?</title>
<meta name="description" content="כמה חם עכשיו, וכמה היה חם בדיוק לפני שנה. אותו מקום, אותו תאריך, אותה שעה.">
<meta name="theme-color" content="#0f1115">
<meta property="og:title" content="חם ככה">
<meta property="og:description" content="היה חם ככה שנה שעברה? עכשיו תדע.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --bg2:#171a21;
    --fg:#f2f4f8; --muted:#8b93a3; --line:rgba(255,255,255,.09);
    --card:rgba(255,255,255,.045);
    --accent:#9aa3b2;
    --shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    font-weight:400; line-height:1.5;
    display:flex; flex-direction:column; align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    transition:background 1.1s ease;
    overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:var(--glow,radial-gradient(120% 80% at 50% 0%,rgba(120,130,150,.18),transparent 70%));
    transition:background 1.1s ease;
  }
  .wrap{width:100%; max-width:560px; margin:auto 0; display:flex; flex-direction:column; gap:22px}

  /* ---- מקום ותאריך ---- */
  .place{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:15px}
  .place b{color:var(--fg); font-weight:500}
  .place button{
    background:none; border:0; color:var(--muted); font:inherit; font-size:14px;
    cursor:pointer; padding:4px 10px; border-radius:999px; border:1px solid var(--line);
    transition:.18s;
  }
  .place button:hover{color:var(--fg); border-color:rgba(255,255,255,.28)}

  /* ---- הפסק ---- */
  .verdict{text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center}
  .verdict .emoji{font-size:clamp(44px,13vw,64px); line-height:1; filter:saturate(1.1)}
  .verdict h1{
    margin:0; font-weight:900; letter-spacing:-.02em;
    font-size:clamp(30px,8.2vw,46px); line-height:1.12;
    text-wrap:balance;
  }
  .verdict .sub{margin:0; color:var(--muted); font-size:clamp(15px,4vw,17px); font-weight:300; text-wrap:balance; max-width:34ch}

  /* ---- כרטיסי טמפרטורה ---- */
  .cards{display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:10px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 12px 16px; text-align:center; backdrop-filter:blur(12px);
    display:flex; flex-direction:column; gap:2px; justify-content:center;
  }
  .card .label{color:var(--muted); font-size:13px; font-weight:500; letter-spacing:.02em}
  .card .temp{direction:ltr; font-size:clamp(34px,10vw,44px); font-weight:700; letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums}
  .card .temp span{font-size:.5em; font-weight:400; color:var(--muted); margin-inline-start:1px}
  .card .feels{color:var(--muted); font-size:12.5px; font-weight:300; margin-top:3px}
  .vs{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    min-width:74px; padding:0 2px;
  }
  .vs .delta{
    direction:ltr;
    font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    padding:7px 11px; border-radius:999px; white-space:nowrap;
    background:var(--deltaBg,rgba(255,255,255,.08)); color:var(--deltaFg,var(--fg));
    transition:.6s;
  }
  .vs .vsx{color:var(--muted); font-size:11.5px; letter-spacing:.06em; font-weight:500}

  /* ---- כותרת תחתית ---- */
  .foot{text-align:center; color:var(--muted); font-size:12.5px; font-weight:300; line-height:1.7}
  .foot a{color:var(--muted); text-decoration:underline; text-underline-offset:3px}

  /* ---- מצבים ---- */
  .msg{text-align:center; padding:40px 0; color:var(--muted); font-size:16px; font-weight:300}
  .spin{
    width:26px; height:26px; margin:0 auto 14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.14); border-top-color:var(--fg);
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .55s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}

  /* ---- חיפוש עיר ---- */
  .sheet{
    position:fixed; inset:0; z-index:20; background:rgba(8,9,12,.82);
    backdrop-filter:blur(14px); display:none; padding:22px;
    flex-direction:column; align-items:center; gap:14px;
  }
  .sheet.on{display:flex}
  .sheet .box{width:100%; max-width:440px; margin-top:8vh; display:flex; flex-direction:column; gap:12px}
  .sheet h2{margin:0 0 2px; font-size:20px; font-weight:700}
  .sheet input{
    width:100%; padding:15px 17px; font:inherit; font-size:16px;
    background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:14px;
    color:var(--fg); outline:none; transition:.18s;
  }
  .sheet input:focus{border-color:rgba(255,255,255,.34); background:rgba(255,255,255,.09)}
  .sheet input::placeholder{color:#6c7484}
  .results{display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; -webkit-overflow-scrolling:touch}
  .results button, .geobtn{
    width:100%; text-align:start; padding:13px 15px; font:inherit; font-size:15px;
    background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:13px;
    color:var(--fg); cursor:pointer; transition:.15s; display:flex; align-items:baseline; gap:8px;
  }
  .results button:hover,.geobtn:hover{background:rgba(255,255,255,.1)}
  .results button small,.geobtn small{color:var(--muted); font-weight:300; font-size:13px}
  .geobtn{justify-content:center; text-align:center}
  .sheet .close{
    background:none; border:0; color:var(--muted); font:inherit; font-size:15px;
    cursor:pointer; padding:10px; margin-top:2px;
  }
  .hint{color:var(--muted); font-size:13px; font-weight:300; text-align:center}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="msg"><div class="spin"></div>רגע, בודק…</div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <h2>איפה אתה?</h2>
    <input id="q" type="search" placeholder="תל אביב, חיפה, ברלין…" autocomplete="off" enterkeyhint="search">
    <button class="geobtn" id="useGeo">📍 השתמש במיקום שלי</button>
    <div class="results" id="res"></div>
    <div class="hint" id="hint"></div>
    <button class="close" id="closeSheet">ביטול</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   הסולם — כל רמה עם כמה ניסוחים, נבחר אחד יציב ליום
   ============================================================ */
const SCALE = [
  { min: 8,           emoji:'🔥🔥', glow:'#ff4d2e', texts:[
      'אוקיי, זה כבר לא מזג אוויר. זו עמדה.',
      'בשנה שעברה בתאריך הזה חיינו חיים אחרים',
      'מישהו הזיז את כדור הארץ קצת קדימה' ]},
  { min: 5,           emoji:'🔥',   glow:'#ff7a1a', texts:[
      'חם. לא "חם ישראלי". חם חם.',
      'שנה שעברה אפשר היה לצאת. היום פחות.',
      'השנה החליטה להראות לנו מי כאן הבוס' ]},
  { min: 3,           emoji:'😮‍💨', glow:'#ffa53d', texts:[
      'יותר חם, ובאופן שמרגישים',
      'לא אסון, אבל שמנו לב',
      'השנה מתאמצת. לא ביקשנו.' ]},
  { min: 1.5,         emoji:'🙂',   glow:'#ffce6b', texts:[
      'טיפה יותר חם. כאילו, טיפה.',
      'בקושי. אבל כן.',
      'ההבדל בגודל של אנחה אחת' ]},
  { min: -1.5,        emoji:'😐',   glow:'#8b93a3', texts:[
      'בערך אותו שיט',
      'אותו דבר. ליטרלית.',
      'שנה עברה, כלום לא זז',
      'היקום החליט לא להתערב הפעם' ]},
  { min: -3,          emoji:'🙃',   glow:'#8fd0c4', texts:[
      'טיפה יותר נעים. ניקח.',
      'קצת יותר קריר, וזה נחמד',
      'טובה קטנה, בלי דרמות' ]},
  { min: -5,          emoji:'😌',   glow:'#5bc0d8', texts:[
      'יותר נעים משנה שעברה. תיהנו.',
      'מתנה קטנה מהאטמוספירה',
      'אפשר לצאת בלי לתכנן מסלול צל' ]},
  { min: -8,          emoji:'🧊',   glow:'#4b9df0', texts:[
      'קר יותר. ממש יותר.',
      'שנה שעברה זה היה קיץ. היום פחות.',
      'תביא סוודר. ברצינות.' ]},
  { min: -Infinity,   emoji:'🧊🧊', glow:'#4668f0', texts:[
      'מה קרה פה? זו עונה אחרת לגמרי',
      'זה לא אותו תאריך, זה לא אותו כוכב',
      'הביאו לנו בטעות את מזג האוויר של מישהו אחר' ]},
];

/* שורה שנייה — לפי הטמפרטורה המוחלטת עכשיו */
function context(now){
  const deg = n => `<span dir="ltr">${Math.round(n)}°</span>`;
  if (now >= 38) return 'ובכל מקרה ' + deg(now) + ', אז זה כבר עניין של הישרדות';
  if (now >= 30) return 'אבל בוא נודה, זה קיץ. מה ציפית.';
  if (now >= 20) return 'בסך הכל מזג אוויר של בן אדם';
  if (now >= 10) return 'ובגדול, מזג אוויר סביר לחלוטין';
  return 'וממילא ' + deg(now) + ', אז ההבדל הוא בין קר לקר';
}

/* בחירה יציבה: אותו טקסט לאורך כל היום באותו מקום */
function pick(arr, seed){
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return arr[Math.abs(h) % arr.length];
}

const WMO = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};

/* ============================================================
   עזרים
   ============================================================ */
const $ = s => document.querySelector(s);
const app = $('#app'), sheet = $('#sheet');
const pad = n => String(n).padStart(2,'0');
const KEY = 'hamkacha.place';

function lastYear(d){
  // 29 בפברואר לא קיים בכל שנה — נופלים ל-28
  const y = d.getFullYear() - 1, m = d.getMonth(), day = d.getDate();
  const safe = (m === 1 && day === 29) ? 28 : day;
  return `${y}-${pad(m+1)}-${pad(safe)}`;
}
const heDate = d => d.toLocaleDateString('he-IL',{day:'numeric',month:'long'});

async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ============================================================
   שליפת הנתונים
   ============================================================ */
async function load(place){
  app.innerHTML = '<div class="msg"><div class="spin"></div>רגע, בודק…</div>';
  const { lat, lon, name } = place;
  const q = `latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&timezone=auto`;

  try {
    const now = await getJSON(
      `https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,apparent_temperature,weather_code`
    );

    // "עכשיו" לפי השעון המקומי של המקום, לא של הגולש
    const localNow = new Date(now.current.time);
    const hour = localNow.getHours();
    const date = lastYear(localNow);

    const past = await getJSON(
      `https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${date}&end_date=${date}` +
      `&hourly=temperature_2m,apparent_temperature`
    );

    const i = past.hourly.time.findIndex(t => t.endsWith(`T${pad(hour)}:00`));
    const then     = past.hourly.temperature_2m[i];
    const thenFeel = past.hourly.apparent_temperature[i];
    if (then == null) throw new Error('אין נתונים לתאריך הזה');

    render({
      name, hour, localNow,
      now:  now.current.temperature_2m,
      nowFeel: now.current.apparent_temperature,
      code: now.current.weather_code,
      then, thenFeel,
      seed: `${lat.toFixed(2)},${lon.toFixed(2)},${localNow.toDateString()}`
    });
  } catch (e) {
    app.innerHTML = `<div class="msg fade">משהו השתבש 🤷<br><small style="opacity:.7">${e.message}</small><br><br>
      <button class="geobtn" style="max-width:220px;margin:0 auto" onclick="location.reload()">נסה שוב</button></div>`;
  }
}

/* ============================================================
   תצוגה
   ============================================================ */
function render(d){
  const delta = d.now - d.then;
  const level = SCALE.find(s => delta >= s.min);
  const text  = pick(level.texts, d.seed);
  const sign  = delta > 0 ? '+' : delta < 0 ? '−' : '';
  const abs   = Math.abs(delta).toFixed(1);

  document.body.style.setProperty('--glow',
    `radial-gradient(125% 85% at 50% 0%, ${level.glow}30, transparent 68%)`);
  document.body.style.setProperty('--deltaBg', level.glow + '26');
  document.body.style.setProperty('--deltaFg', level.glow);
  document.querySelector('meta[name=theme-color]').content = '#0f1115';

  const t = n => `${n.toFixed(1)}<span>°</span>`;

  app.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="place">
        <b>${d.name}</b>
        <span>·</span><span>${heDate(d.localNow)}, <span dir="ltr">${pad(d.hour)}:00</span></span>
        <button id="chg">שנה מיקום</button>
      </div>

      <div class="verdict">
        <div class="emoji">${level.emoji}</div>
        <h1>${text}</h1>
        <p class="sub">${context(d.now)}</p>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">עכשיו ${WMO[d.code] || ''}</div>
          <div class="temp">${t(d.now)}</div>
          <div class="feels">מרגיש כמו <span dir="ltr">${Math.round(d.nowFeel)}°</span></div>
        </div>
        <div class="vs">
          <div class="delta">${sign}${abs}°</div>
          <div class="vsx">הפרש</div>
        </div>
        <div class="card">
          <div class="label">לפני שנה</div>
          <div class="temp">${t(d.then)}</div>
          <div class="feels">מרגיש כמו <span dir="ltr">${Math.round(d.thenFeel)}°</span></div>
        </div>
      </div>

      <div class="foot">
        אותו מקום, אותו תאריך, אותה שעה — רק שנה אחת אחורה.<br>
        נתונים: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · ERA5
      </div>
    </div>`;

  $('#chg').onclick = openSheet;
}

/* ============================================================
   בחירת מיקום
   ============================================================ */
function save(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} }
function saved(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } }

function openSheet(){ sheet.classList.add('on'); $('#q').focus(); }
function closeSheet(){ sheet.classList.remove('on'); $('#res').innerHTML=''; $('#q').value=''; $('#hint').textContent=''; }
$('#closeSheet').onclick = closeSheet;
sheet.onclick = e => { if (e.target === sheet) closeSheet(); };

let timer;
$('#q').oninput = e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  if (v.length < 2) { $('#res').innerHTML=''; return; }
  timer = setTimeout(async () => {
    try {
      const r = await getJSON(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=he`);
      $('#res').innerHTML = (r.results || []).map(x =>
        `<button data-lat="${x.latitude}" data-lon="${x.longitude}" data-name="${x.name}">
           ${x.name} <small>${[x.admin1, x.country].filter(Boolean).join(', ')}</small>
         </button>`).join('') || '<div class="hint">לא נמצא. נסה איות אחר.</div>';
      $('#res').querySelectorAll('button').forEach(b => b.onclick = () => {
        const p = { lat:+b.dataset.lat, lon:+b.dataset.lon, name:b.dataset.name };
        save(p); closeSheet(); load(p);
      });
    } catch(e){ $('#res').innerHTML = '<div class="hint">החיפוש לא זמין כרגע.</div>'; }
  }, 260);
};

$('#useGeo').onclick = () => locate(true);

function locate(explicit){
  if (!navigator.geolocation) { openSheet(); return; }
  $('#hint').textContent = 'מבקש מיקום…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = 'המיקום שלך';
    try {
      const g = await getJSON(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=he`);
      name = g.city || g.locality || g.principalSubdivision || name;
    } catch(e){}
    const p = { lat, lon, name };
    save(p); closeSheet(); load(p);
  }, () => {
    $('#hint').textContent = 'אין גישה למיקום — חפש עיר ידנית.';
    if (!explicit) openSheet();
  }, { timeout: 9000, maximumAge: 600000 });
}

/* ============================================================
   התחלה
   ============================================================ */
const s = saved();
if (s) load(s);
else if (navigator.geolocation) { app.innerHTML = '<div class="msg"><div class="spin"></div>מאתר אותך…</div>'; locate(false); }
else openSheet();

})();
</script>
</body>
</html>
